<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="sq_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191F31" />
      <stop offset="100%" stop-color="#080B16" />
    </linearGradient>
    <filter id="app_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#sq_bg)" stroke="#8B5CF6" stroke-width="2.5" stroke-opacity="0.6" />
  <g transform="translate(14, 12) scale(0.92)">
    
    <defs>
      <linearGradient id="app_top" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#C4B5FD" />
        <stop offset="100%" stop-color="#A78BFA" />
      </linearGradient>
      <linearGradient id="app_stem" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#A78BFA" />
        <stop offset="100%" stop-color="#6D28D9" />
      </linearGradient>
      <linearGradient id="app_loop" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#C4B5FD" />
        <stop offset="100%" stop-color="#8B5CF6" />
      </linearGradient>
      <linearGradient id="app_leg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#A78BFA" />
        <stop offset="100%" stop-color="#6D28D9" />
      </linearGradient>
      <filter id="app_glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
    </defs>

    <!-- Faceted Modern 'R' Geometry -->
    <g stroke="none" stroke-width="0" stroke-linejoin="round">
      <!-- Left Stem -->
      <polygon points="40,30 90,30 90,210 40,210" fill="url(#app_stem)" />
      
      <!-- Top Arc/Loop Outer -->
      <path d="M 90,30 L 160,30 C 195,30 220,55 220,88 C 220,120 195,142 160,142 L 90,142 Z" fill="url(#app_loop)" />
      
      <!-- Loop Inner Cutout (Dark Surface) -->
      <path d="M 90,65 L 145,65 C 165,65 178,75 178,88 C 178,102 165,110 145,110 L 90,110 Z" fill="#080B16" />

      <!-- Diagonal Dynamic Leg -->
      <polygon points="120,132 170,132 230,210 175,210" fill="url(#app_leg)" />

      <!-- Top Left Facet Chamfer / Glow Highlight -->
      <polygon points="35,30 65,10 90,30 40,30" fill="url(#app_top)" />

      <!-- Sparkle Star at Top Crest -->
      <g transform="translate(68, 22) scale(0.85)">
        <path d="M 0,-16 Q 0,0 16,0 Q 0,0 0,16 Q 0,0 -16,0 Q 0,0 0,-16 Z" fill="#FFFFFF" filter="url(#app_glow)" />
      </g>
    </g>
  
  </g>
</svg>