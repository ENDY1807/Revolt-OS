<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <g opacity="0.35">
    <g transform="translate(10, 0) scale(0.42)">
      
    <defs>
      <linearGradient id="wm_top" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF" />
        <stop offset="100%" stop-color="#A78BFA" />
      </linearGradient>
      <linearGradient id="wm_stem" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#A78BFA" />
        <stop offset="100%" stop-color="#6D28D9" />
      </linearGradient>
      <linearGradient id="wm_loop" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF" />
        <stop offset="100%" stop-color="#8B5CF6" />
      </linearGradient>
      <linearGradient id="wm_leg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#A78BFA" />
        <stop offset="100%" stop-color="#6D28D9" />
      </linearGradient>
      <filter id="wm_glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
    </defs>

    <!-- Faceted Modern 'R' Geometry -->
    <g stroke="none" stroke-width="0" stroke-linejoin="round">
      <!-- Left Stem -->
      <polygon points="40,30 90,30 90,210 40,210" fill="url(#wm_stem)" />
      
      <!-- Top Arc/Loop Outer -->
      <path d="M 90,30 L 160,30 C 195,30 220,55 220,88 C 220,120 195,142 160,142 L 90,142 Z" fill="url(#wm_loop)" />
      
      <!-- Loop Inner Cutout (Dark Surface) -->
      <path d="M 90,65 L 145,65 C 165,65 178,75 178,88 C 178,102 165,110 145,110 L 90,110 Z" fill="#080B16" />

      <!-- Diagonal Dynamic Leg -->
      <polygon points="120,132 170,132 230,210 175,210" fill="url(#wm_leg)" />

      <!-- Top Left Facet Chamfer / Glow Highlight -->
      <polygon points="35,30 65,10 90,30 40,30" fill="url(#wm_top)" />

      <!-- Sparkle Star at Top Crest -->
      <g transform="translate(68, 22) scale(0.85)">
        <path d="M 0,-16 Q 0,0 16,0 Q 0,0 0,16 Q 0,0 -16,0 Q 0,0 0,-16 Z" fill="#FFFFFF" filter="url(#wm_glow)" />
      </g>
    </g>
  
    </g>
    <text x="120" y="55" font-family="'Inter', sans-serif" font-size="32" font-weight="800" fill="#FFFFFF">
      RevoltOS
    </text>
    <text x="122" y="78" font-family="'Inter', sans-serif" font-size="12" font-weight="500" letter-spacing="4" fill="#A78BFA">
      v1.0.0 BETA
    </text>
  </g>
</svg>