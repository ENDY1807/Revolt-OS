<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="revoltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B56BFF" />
      <stop offset="100%" stop-color="#8B35FF" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15152B" />
      <stop offset="100%" stop-color="#080817" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield Canvas -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" stroke="#8B35FF" stroke-width="8" stroke-opacity="0.3" />

  <!-- Outer Ambient Aura -->
  <circle cx="256" cy="256" r="180" fill="#8B35FF" opacity="0.08" filter="url(#glow)" />

  <!-- Geometric Revolt 'R' Monogram -->
  <g filter="url(#glow)">
    <!-- Vertical Spine (Speed & Strength) -->
    <path d="M 148 116 L 212 116 L 212 396 L 148 396 Z" fill="url(#revoltGrad)" />
    
    <!-- Upper Geometric Loop (Innovation & Completeness) -->
    <path d="M 212 116 L 312 116 C 376 116 396 156 396 216 C 396 276 364 296 296 296 L 212 296 Z" 
          fill="none" stroke="url(#revoltGrad)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Forward Dynamic Kinetic Leg (Freedom & Velocity) -->
    <path d="M 272 276 L 388 396" 
          stroke="#B56BFF" stroke-width="52" stroke-linecap="round" />

    <!-- Core Focal Spark (Independence) -->
    <polygon points="212,236 260,236 236,276 284,276 220,348 232,288 196,288" fill="#F5F3FF" opacity="0.95" />
  </g>
</svg>

