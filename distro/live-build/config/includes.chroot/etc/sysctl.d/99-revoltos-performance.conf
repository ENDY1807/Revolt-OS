# ==============================================================================
# RevoltOS Performance Kernel & Memory Sysctl Tuning
# Inspired by CachyOS scheduler tuning and Fedora memory optimization
# ==============================================================================

# Memory & Swap Management (Optimized for ZRAM)
vm.swappiness = 10
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5
vm.vfs_cache_pressure = 50

# Developer & Heavy IDE Limits (Vite, Webpack, Rust, Game Engines)
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024
fs.file-max = 2097152
vm.max_map_count = 2147483642

# High-Throughput & Low-Latency Networking
net.ipv4.tcp_fastopen = 3
net.core.default_qdisc = fq_pie
net.ipv4.tcp_congestion_control = bbr

# Security & Kernel Hardening
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
kernel.yama.ptrace_scope = 1
