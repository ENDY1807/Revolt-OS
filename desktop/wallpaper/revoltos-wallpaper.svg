<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1c1236" />
      <stop offset="55%" stop-color="#0d091e" />
      <stop offset="100%" stop-color="#06050d" />
    </radialGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B56BFF" />
      <stop offset="100%" stop-color="#8B35FF" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B35FF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3D127A" stop-opacity="0.05" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Obsidian Canvas -->
  <rect width="3840" height="2160" fill="url(#bgGlow)" />

  <!-- Geometric Polygonal Mesh Gradients -->
  <polygon points="0,0 1600,0 800,900" fill="url(#accentGrad)" />
  <polygon points="3840,0 2200,0 3100,1100" fill="url(#accentGrad)" />
  <polygon points="0,2160 1200,2160 500,1400" fill="url(#accentGrad)" />
  <polygon points="3840,2160 2500,2160 3300,1300" fill="url(#accentGrad)" />

  <!-- Center Ambient Core Aura -->
  <circle cx="1920" cy="1080" r="480" fill="#8B35FF" opacity="0.12" filter="url(#glow)" />
  <circle cx="1920" cy="1080" r="280" fill="#B56BFF" opacity="0.08" filter="url(#glow)" />

  <!-- Central Floating Emblem Backdrop Shield -->
  <polygon points="1920,860 2100,970 2100,1190 1920,1300 1740,1190 1740,970" 
           fill="#15122b" stroke="#8B35FF" stroke-width="4" stroke-opacity="0.4" />

  <!-- Stylized Revolt 'R' Monogram -->
  <g transform="translate(1820, 940) scale(2.0)">
    <path d="M 15 15 L 15 125 L 38 125 L 38 78 L 62 78 L 86 125 L 112 125 L 84 72 C 98 67 108 55 108 38 C 108 22 95 15 75 15 Z M 38 34 L 70 34 C 79 34 85 39 85 47 C 85 55 79 59 70 59 L 38 59 Z" 
          fill="url(#primaryGrad)" />
  </g>

  <!-- Typography Wordmark -->
  <text x="1920" y="1420" 
        text-anchor="middle" 
        font-family="'Inter', 'Noto Sans', sans-serif" 
        font-size="44" 
        font-weight="700" 
        letter-spacing="14" 
        fill="#FFFFFF" 
        opacity="0.85">REVOLT OS</text>
  <text x="1920" y="1465" 
        text-anchor="middle" 
        font-family="'Inter', 'Noto Sans', sans-serif" 
        font-size="20" 
        font-weight="400" 
        letter-spacing="6" 
        fill="#B56BFF" 
        opacity="0.7">INTELLIGENT DEVELOPER DISTRIBUTION</text>
</svg>
