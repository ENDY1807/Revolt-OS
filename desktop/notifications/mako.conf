# RevoltOS Mako Notification Configuration
max-history=50
sort=-time

# Appearance
font=Inter 10
background-color=#15152Be6
text-color=#F5F3FF
width=360
height=110
margin=16
padding=12
border-size=2
border-color=#8B35FF
border-radius=12
default-timeout=5000
icons=1
max-icon-size=48

# Urgency Levels
[urgency=low]
border-color=#20203A
default-timeout=3000

[urgency=normal]
border-color=#8B35FF

[urgency=critical]
border-color=#EF4444
default-timeout=0
