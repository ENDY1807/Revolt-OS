# ==============================================================================
# RevoltOS Official Hyprland Compositor Configuration
# Palette: Primary: #8B35FF | Accent: #B56BFF | Base: #080817 | Surface: #15152B
# ==============================================================================

# Monitor configuration (Dynamic fallback)
monitor = , preferred, auto, 1

# Environment Variables for Wayland & Graphics
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = GDK_BACKEND,wayland,x11
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = MOZ_ENABLE_WAYLAND,1

# Autostart System Services and Desktop Shell
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/polkit-kde-authentication-agent-1 || /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = waybar -c ~/.config/waybar/config.jsonc -s ~/.config/waybar/style.css
exec-once = mako
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = python3 -m revolt_ai.backend.server --daemon
exec-once = python3 /usr/share/revoltos/revolt-island/main.py

# Input Configuration
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
    }
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

# General Layout & Styling
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgb(8B35FF) rgb(B56BFF) 45deg
    col.inactive_border = rgba(20203Aaa)
    layout = dwindle
    allow_tearing = false
}

# Window Decorations & Blur
decoration {
    rounding = 10
    active_opacity = 0.98
    inactive_opacity = 0.92

    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
        xray = false
        noise = 0.01
        vibrancy = 0.1696
    }

    shadow {
        enabled = true
        range = 14
        render_power = 3
        color = rgba(08081799)
    }
}

# Smooth Animations
animations {
    enabled = true
    bezier = revoltEase, 0.05, 0.9, 0.1, 1.05
    bezier = linear, 0.0, 0.0, 1.0, 1.0

    animation = windows, 1, 4, revoltEase, slide
    animation = windowsOut, 1, 4, default, popin 80%
    animation = border, 1, 8, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 4, default
    animation = workspaces, 1, 5, revoltEase, slide
}

# Layout Rules
dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

# Window Rules
windowrulev2 = suppressevent maximize, class:.*
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(calamares)$
windowrulev2 = float, class:^(revolt-settings)$
windowrulev2 = center, class:^(revolt-settings)$
windowrulev2 = size 960 640, class:^(revolt-settings)$

# Revolt Island Layer & Window Rules
windowrulev2 = float, title:^(Revolt Island)$
windowrulev2 = pin, title:^(Revolt Island)$
windowrulev2 = noborder, title:^(Revolt Island)$
windowrulev2 = noanim, title:^(Revolt Island)$

# Keybindings
$mainMod = SUPER

# Core Applications
bind = $mainMod, RETURN, exec, kitty
bind = $mainMod, SPACE, exec, dbus-send --session --dest=org.revoltos.Island --type=method_call /org/revoltos/Island org.revoltos.Island.ToggleAI
bind = $mainMod, D, exec, rofi -show drun -theme ~/.config/rofi/revoltos.rasi
bind = $mainMod, E, exec, thunar
bind = $mainMod, I, exec, revolt-settings
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, Q, killactive
bind = $mainMod, M, exit
bind = $mainMod, V, togglefloating
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, P, pseudo
bind = $mainMod, J, togglesplit

# Audio & Media Controls
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

# Brightness Controls
binde = , XF86MonBrightnessUp, exec, brightnessctl set +5%
binde = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Screenshots (Grim & Slurp)
bind = , Print, exec, grim ~/Pictures/Screenshots/$(date +'%Y-%m-%d_%H-%M-%S').png
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy

# Workspace Navigation
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# Move Window to Workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# Mouse Drag & Resize
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
